<svg xmlns="http://www.w3.org/2000/svg" width="720" height="615" viewBox="0 0 720 615" role="img">
<title>Joint eDNA and visual model structure</title>
<desc>Each species has one latent density field, set by its GP hyperparameters, intercept and bottom-depth spline. The same field feeds two observation models. On the eDNA side, the field and the eDNA parameters (bottle noise theta, junk spread theta_junk, read dispersion phi, and conversion factors that are fixed or optionally free for the cetaceans) set each bottle's unobserved copy numbers, which feed its observed qPCR and metabarcoding replicates. On the visual side, the field and the visual parameters (detection function, group size) set the observed detections per segment and the distances and group sizes of detected groups, for humpback and PWSD.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .note { fill: #444441; }
  .plate { fill: none; stroke: #888780; stroke-width: 0.75; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .head { stroke: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  @media (prefers-color-scheme: dark) {
    .note { fill: #D3D1C7; }
    .plate { stroke: #B4B2A9; }
    .arr, .head { stroke: #B4B2A9; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .th { fill: #F5C4B3; } .coral .ts { fill: #F0997B; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #9FE1CB; } .teal .ts { fill: #5DCAA5; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="purple"><rect x="170" y="30" width="180" height="56" rx="8"/>
<text class="th" x="260" y="48" text-anchor="middle" dominant-baseline="central">GP hyperparameters</text>
<text class="ts" x="260" y="68" text-anchor="middle" dominant-baseline="central">ℓx, ℓy, σ per species</text></g>
<g class="purple"><rect x="370" y="30" width="180" height="56" rx="8"/>
<text class="th" x="460" y="48" text-anchor="middle" dominant-baseline="central">Intercept, spline</text>
<text class="ts" x="460" y="68" text-anchor="middle" dominant-baseline="central">μₛ, bottom-depth βₛ</text></g>
<g class="purple"><rect x="210" y="120" width="300" height="56" rx="8"/>
<text class="th" x="360" y="138" text-anchor="middle" dominant-baseline="central">Shared density field λₛ(x)</text>
<text class="ts" x="360" y="158" text-anchor="middle" dominant-baseline="central">One per species: hake, humpback, PWSD</text></g>
<g class="purple"><rect x="20" y="220" width="200" height="56" rx="8"/>
<text class="th" x="120" y="238" text-anchor="middle" dominant-baseline="central">eDNA parameters</text>
<text class="ts" x="120" y="258" text-anchor="middle" dominant-baseline="central">θ, θ_junk, φ; conversion*</text></g>
<g class="purple"><rect x="500" y="220" width="200" height="56" rx="8"/>
<text class="th" x="600" y="238" text-anchor="middle" dominant-baseline="central">Visual parameters</text>
<text class="ts" x="600" y="258" text-anchor="middle" dominant-baseline="central">Detection, group size</text></g>
<rect class="plate" x="20" y="310" width="330" height="215" rx="12" stroke-dasharray="5 4"/>
<text class="ts note" x="36" y="516">For each eDNA bottle (all species)</text>
<g class="coral"><rect x="50" y="335" width="270" height="56" rx="8"/>
<text class="th" x="185" y="353" text-anchor="middle" dominant-baseline="central">Bottle copies Cᵢₛ, junk Jᵢ</text>
<text class="ts" x="185" y="373" text-anchor="middle" dominant-baseline="central">NB draws, never seen</text></g>
<g class="teal"><rect x="50" y="425" width="270" height="56" rx="8"/>
<text class="th" x="185" y="443" text-anchor="middle" dominant-baseline="central">qPCR + metabarcoding</text>
<text class="ts" x="185" y="463" text-anchor="middle" dominant-baseline="central">Replicates (qPCR: hake only)</text></g>
<rect class="plate" x="370" y="310" width="330" height="215" rx="12" stroke-dasharray="5 4"/>
<text class="ts note" x="386" y="516">For each segment (humpback, PWSD)</text>
<g class="teal"><rect x="395" y="335" width="240" height="56" rx="8"/>
<text class="th" x="515" y="353" text-anchor="middle" dominant-baseline="central">Detections per segment</text>
<text class="ts" x="515" y="373" text-anchor="middle" dominant-baseline="central">Poisson, scaled by ESW</text></g>
<g class="teal"><rect x="395" y="425" width="240" height="56" rx="8"/>
<text class="th" x="515" y="443" text-anchor="middle" dominant-baseline="central">Distances, group sizes</text>
<text class="ts" x="515" y="463" text-anchor="middle" dominant-baseline="central">Per detected group</text></g>
<line class="arr" x1="260" y1="86" x2="320" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="460" y1="86" x2="400" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="176" x2="220" y2="333" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="176" x2="500" y2="333" marker-end="url(#arrow)"/>
<line class="arr" x1="120" y1="276" x2="150" y2="333" marker-end="url(#arrow)"/>
<line class="arr" x1="600" y1="276" x2="570" y2="333" marker-end="url(#arrow)"/>
<line class="arr" x1="682" y1="276" x2="640" y2="440" marker-end="url(#arrow)"/>
<line class="arr" x1="185" y1="391" x2="185" y2="423" marker-end="url(#arrow)"/>
<line class="arr" x1="515" y1="391" x2="515" y2="423" marker-end="url(#arrow)"/>
<text class="ts note" x="360" y="555" text-anchor="middle">* Conversion factors fixed, or free for the cetaceans (n_conv_free), so visual data set their scale</text>
<text class="ts note" x="360" y="575" text-anchor="middle">use_edna / use_visual switch either likelihood off; priors, basis and inits stay the same</text>
<text class="ts note" x="360" y="600" text-anchor="middle">Purple = estimated · coral = latent, one per bottle · teal = observed</text>
</svg>
