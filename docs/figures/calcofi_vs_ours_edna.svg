<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img">
<title>How eDNA enters the two models</title>
<desc>Top: the CalCOFI model in two stages. Reads per PCR replicate go into a non-spatial metabarcoding model fitted per sequencing pool; it produces a per-filter summary (detected or not, and the median and sd of log lambda), which enters a stage-2 hurdle whose detection and amount terms have free slopes b_det and b_edna on the density shape (log D minus the intercept and cruise level). Bottom: this repository in one stage. The absolute density field times a conversion factor, volume, water-column offset and a bottle noise factor gives each bottle's copies; junk copies have their own per-bottle factor; qPCR replicates (hake) and metabarcoding replicates are modelled directly from those copies.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 13px; font-weight: 500; }
  .ts { font-size: 11px; }
  .hd { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .div { stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 4 4; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
  .gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
  .note { font-size: 11px; fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="hd" x="20" y="28">CalCOFI: two stages</text>
<g class="teal"><rect x="20" y="44" width="150" height="56" rx="8"/>
<text class="th" x="95" y="64" text-anchor="middle">Reads per PCR</text>
<text class="ts" x="95" y="84" text-anchor="middle">replicate</text></g>
<g class="gray"><rect x="205" y="44" width="170" height="56" rx="8"/>
<text class="th" x="290" y="64" text-anchor="middle">Stage 1: metabarcoding</text>
<text class="ts" x="290" y="84" text-anchor="middle">non-spatial, per pool</text></g>
<g class="gray"><rect x="410" y="44" width="160" height="56" rx="8"/>
<text class="th" x="490" y="64" text-anchor="middle">Per-filter summary</text>
<text class="ts" x="490" y="84" text-anchor="middle">detected? median, sd log λ</text></g>
<g class="gray"><rect x="605" y="44" width="155" height="56" rx="8"/>
<text class="th" x="682" y="64" text-anchor="middle">Stage-2 hurdle</text>
<text class="ts" x="682" y="84" text-anchor="middle">slopes b_det, b_edna</text></g>
<g class="purple"><rect x="410" y="134" width="160" height="56" rx="8"/>
<text class="th" x="490" y="154" text-anchor="middle">Density shape</text>
<text class="ts" x="490" y="174" text-anchor="middle">log D − μ − ℓ_c</text></g>
<g class="purple"><rect x="605" y="134" width="155" height="56" rx="8"/>
<text class="th" x="682" y="154" text-anchor="middle">Per-cruise intercepts</text>
<text class="ts" x="682" y="174" text-anchor="middle">a_det,c and a_edna,c</text></g>
<line class="arr" x1="170" y1="72" x2="203" y2="72" marker-end="url(#arrow)"/>
<line class="arr" x1="375" y1="72" x2="408" y2="72" marker-end="url(#arrow)"/>
<line class="arr" x1="570" y1="72" x2="603" y2="72" marker-end="url(#arrow)"/>
<path class="arr" d="M570 150 L620 102" marker-end="url(#arrow)"/>
<line class="arr" x1="682" y1="134" x2="682" y2="102" marker-end="url(#arrow)"/>
<text class="note" x="20" y="150">eDNA informs the shape of each</text>
<text class="note" x="20" y="166">cruise's surface, never its level.</text>

<line class="div" x1="20" y1="212" x2="760" y2="212"/>

<text class="hd" x="20" y="242">This repo: one stage</text>
<g class="purple"><rect x="20" y="258" width="150" height="56" rx="8"/>
<text class="th" x="95" y="278" text-anchor="middle">Density λₛ(x)</text>
<text class="ts" x="95" y="298" text-anchor="middle">absolute, per km²</text></g>
<g class="coral"><rect x="205" y="258" width="210" height="56" rx="8"/>
<text class="th" x="310" y="278" text-anchor="middle">Bottle copies</text>
<text class="ts" x="310" y="298" text-anchor="middle">λ × cₛ × volume × offset × g</text></g>
<g class="coral"><rect x="205" y="348" width="210" height="56" rx="8"/>
<text class="th" x="310" y="368" text-anchor="middle">Junk copies</text>
<text class="ts" x="310" y="388" text-anchor="middle">constant × g_junk</text></g>
<g class="teal"><rect x="470" y="258" width="200" height="56" rx="8"/>
<text class="th" x="570" y="278" text-anchor="middle">qPCR replicates (hake)</text>
<text class="ts" x="570" y="298" text-anchor="middle">detection + Ct</text></g>
<g class="teal"><rect x="470" y="348" width="200" height="56" rx="8"/>
<text class="th" x="570" y="368" text-anchor="middle">Metabarcoding replicates</text>
<text class="ts" x="570" y="388" text-anchor="middle">ZI beta-binomial vs junk</text></g>
<line class="arr" x1="170" y1="286" x2="203" y2="286" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="286" x2="468" y2="286" marker-end="url(#arrow)"/>
<path class="arr" d="M415 300 L468 360" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="376" x2="468" y2="376" marker-end="url(#arrow)"/>
<text class="note" x="686" y="300">Copies ∝ density</text>
<text class="note" x="686" y="316">(elasticity 1)</text>

<text class="note" x="20" y="424">Purple = density and parameters · coral = latent · teal = observed · grey = stage-1 summary and its likelihood</text>
</svg>
