<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img">
<title>Visual line-transect model structure</title>
<desc>The species' GP hyperparameters, intercept and bottom-depth spline set its latent density field. For each segment, the number of detected groups is Poisson with mean density divided by expected group size, times twice the segment length, times the effective strip half-width from the detection function. For each detected group, the group size and the perpendicular distance are observed; the distance follows the truncated detection function, whose scale depends on group size and optionally Beaufort. The group-size and detection-function parameters are estimated.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .note { fill: #444441; }
  .plate { fill: none; stroke: #888780; stroke-width: 0.75; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .head { stroke: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  @media (prefers-color-scheme: dark) {
    .note { fill: #D3D1C7; }
    .plate { stroke: #B4B2A9; }
    .arr, .head { stroke: #B4B2A9; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .th { fill: #F5C4B3; } .coral .ts { fill: #F0997B; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #9FE1CB; } .teal .ts { fill: #5DCAA5; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="purple"><rect x="20" y="30" width="160" height="56" rx="8"/>
<text class="th" x="100" y="48" text-anchor="middle" dominant-baseline="central">GP hyperparameters</text>
<text class="ts" x="100" y="68" text-anchor="middle" dominant-baseline="central">ℓx, ℓy, σ</text></g>
<g class="purple"><rect x="195" y="30" width="160" height="56" rx="8"/>
<text class="th" x="275" y="48" text-anchor="middle" dominant-baseline="central">Intercept, spline</text>
<text class="ts" x="275" y="68" text-anchor="middle" dominant-baseline="central">μ, bottom-depth β</text></g>
<g class="purple"><rect x="370" y="30" width="160" height="56" rx="8"/>
<text class="th" x="450" y="48" text-anchor="middle" dominant-baseline="central">Group size</text>
<text class="ts" x="450" y="68" text-anchor="middle" dominant-baseline="central">ZT-NB or log-normal</text></g>
<g class="purple"><rect x="545" y="30" width="160" height="56" rx="8"/>
<text class="th" x="625" y="48" text-anchor="middle" dominant-baseline="central">Detection function</text>
<text class="ts" x="625" y="68" text-anchor="middle" dominant-baseline="central">σ₀, β_size, β_bft, b</text></g>
<g class="purple"><rect x="60" y="120" width="260" height="56" rx="8"/>
<text class="th" x="190" y="138" text-anchor="middle" dominant-baseline="central">Density field λ(x)</text>
<text class="ts" x="190" y="158" text-anchor="middle" dominant-baseline="central">μ + f(X, Y) + h(Z), per km²</text></g>
<rect class="plate" x="30" y="210" width="660" height="330" rx="12" stroke-dasharray="5 4"/>
<text class="ts note" x="46" y="531">For each segment i = 1 … N</text>
<g class="teal"><rect x="60" y="250" width="260" height="56" rx="8"/>
<text class="th" x="190" y="268" text-anchor="middle" dominant-baseline="central">Detections nᵢ ~ Poisson</text>
<text class="ts" x="190" y="288" text-anchor="middle" dominant-baseline="central">Mean λᵢ / E[s] × 2Lᵢ × ESWᵢ</text></g>
<rect class="plate" x="360" y="230" width="310" height="270" rx="10" stroke-dasharray="3 3"/>
<text class="ts note" x="376" y="490">For each detected group k = 1 … nᵢ</text>
<g class="teal"><rect x="400" y="250" width="180" height="56" rx="8"/>
<text class="th" x="490" y="268" text-anchor="middle" dominant-baseline="central">Group size sₖ</text>
<text class="ts" x="490" y="288" text-anchor="middle" dominant-baseline="central">Size-biased</text></g>
<g class="teal"><rect x="400" y="380" width="180" height="56" rx="8"/>
<text class="th" x="490" y="398" text-anchor="middle" dominant-baseline="central">Distance yₖ</text>
<text class="ts" x="490" y="418" text-anchor="middle" dominant-baseline="central">Truncated at w</text></g>
<text class="ts note" x="500" y="349">Size shifts σ</text>
<line class="arr" x1="100" y1="86" x2="160" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="275" y1="86" x2="225" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="176" x2="190" y2="248" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="86" x2="290" y2="248" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="86" x2="480" y2="248" marker-end="url(#arrow)"/>
<line class="arr" x1="625" y1="86" x2="315" y2="248" marker-end="url(#arrow)"/>
<line class="arr" x1="665" y1="86" x2="584" y2="395" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="306" x2="490" y2="378" marker-end="url(#arrow)"/>
<text class="ts note" x="360" y="570" text-anchor="middle">ESWᵢ follows from the detection function at segment i’s Beaufort (if used); Lᵢ = segment length</text>
<text class="ts note" x="360" y="590" text-anchor="middle">One species per fit; the joint model fits humpback and PWSD together</text>
<text class="ts note" x="360" y="615" text-anchor="middle">Purple = estimated · teal = observed (no per-segment latent draws)</text>
</svg>
