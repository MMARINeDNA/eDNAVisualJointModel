<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img">
<title>eDNA-only spatial model structure</title>
<desc>Each species' GP hyperparameters, intercept and bottom-depth spline set its latent density field. The field, fixed conversion factors, litres filtered and water-column offsets set each bottle's expected copies; the bottle's species copies are negative-binomial draws with one spread theta shared by all species, and its junk copies have their own spread theta_junk. Neither is observed. Species copies feed the bottle's three qPCR replicates (hake only) and three metabarcoding replicates; junk copies feed only metabarcoding. The read dispersion phi is estimated. The replicates are observed.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .note { fill: #444441; }
  .plate { fill: none; stroke: #888780; stroke-width: 0.75; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .head { stroke: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.75; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.75; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  @media (prefers-color-scheme: dark) {
    .note { fill: #D3D1C7; }
    .plate { stroke: #B4B2A9; }
    .arr, .head { stroke: #B4B2A9; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .th { fill: #F5C4B3; } .coral .ts { fill: #F0997B; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #9FE1CB; } .teal .ts { fill: #5DCAA5; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="purple"><rect x="20" y="30" width="160" height="56" rx="8"/>
<text class="th" x="100" y="48" text-anchor="middle" dominant-baseline="central">GP hyperparameters</text>
<text class="ts" x="100" y="68" text-anchor="middle" dominant-baseline="central">ℓx, ℓy, σ per species</text></g>
<g class="purple"><rect x="195" y="30" width="160" height="56" rx="8"/>
<text class="th" x="275" y="48" text-anchor="middle" dominant-baseline="central">Intercept, spline</text>
<text class="ts" x="275" y="68" text-anchor="middle" dominant-baseline="central">μₛ, bottom-depth βₛ</text></g>
<g class="purple"><rect x="370" y="30" width="160" height="56" rx="8"/>
<text class="th" x="450" y="48" text-anchor="middle" dominant-baseline="central">Bottle noise θ</text>
<text class="ts" x="450" y="68" text-anchor="middle" dominant-baseline="central">Shared by all species</text></g>
<g class="purple"><rect x="545" y="30" width="160" height="56" rx="8"/>
<text class="th" x="625" y="48" text-anchor="middle" dominant-baseline="central">Junk spread θ_junk</text>
<text class="ts" x="625" y="68" text-anchor="middle" dominant-baseline="central">Non-target DNA</text></g>
<g class="purple"><rect x="70" y="120" width="250" height="56" rx="8"/>
<text class="th" x="195" y="138" text-anchor="middle" dominant-baseline="central">Density field λₛ(x)</text>
<text class="ts" x="195" y="158" text-anchor="middle" dominant-baseline="central">μₛ + fₛ(X, Y) + hₛ(Z), per km²</text></g>
<rect class="plate" x="30" y="210" width="660" height="310" rx="12" stroke-dasharray="5 4"/>
<text class="ts note" x="46" y="511">For each bottle i = 1 … N (and species s)</text>
<g class="coral"><rect x="70" y="240" width="280" height="56" rx="8"/>
<text class="th" x="210" y="258" text-anchor="middle" dominant-baseline="central">Bottle copies Cᵢₛ ~ NB(μᵢₛ, θ)</text>
<text class="ts" x="210" y="278" text-anchor="middle" dominant-baseline="central">Per bottle and species, never seen</text></g>
<g class="coral"><rect x="390" y="240" width="270" height="56" rx="8"/>
<text class="th" x="525" y="258" text-anchor="middle" dominant-baseline="central">Junk copies Jᵢ ~ NB(μ_J, θ_junk)</text>
<text class="ts" x="525" y="278" text-anchor="middle" dominant-baseline="central">Per bottle, never seen</text></g>
<rect class="plate" x="90" y="330" width="540" height="145" rx="10" stroke-dasharray="3 3"/>
<g class="teal"><rect x="130" y="355" width="200" height="56" rx="8"/>
<text class="th" x="230" y="373" text-anchor="middle" dominant-baseline="central">qPCR × 3</text>
<text class="ts" x="230" y="393" text-anchor="middle" dominant-baseline="central">Hake only: detection + Ct</text></g>
<g class="teal"><rect x="390" y="355" width="200" height="56" rx="8"/>
<text class="th" x="490" y="373" text-anchor="middle" dominant-baseline="central">Metabarcoding × 3</text>
<text class="ts" x="490" y="393" text-anchor="middle" dominant-baseline="central">Reads, ZI beta-binomial</text></g>
<text class="ts note" x="106" y="462">Replicates share the same bottle’s copies</text>
<g class="purple"><rect x="390" y="545" width="200" height="56" rx="8"/>
<text class="th" x="490" y="563" text-anchor="middle" dominant-baseline="central">Read dispersion φ</text>
<text class="ts" x="490" y="583" text-anchor="middle" dominant-baseline="central">Metabarcoding, estimated</text></g>
<line class="arr" x1="100" y1="86" x2="165" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="275" y1="86" x2="225" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="195" y1="176" x2="190" y2="238" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="86" x2="300" y2="238" marker-end="url(#arrow)"/>
<line class="arr" x1="625" y1="86" x2="560" y2="238" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="296" x2="220" y2="353" marker-end="url(#arrow)"/>
<line class="arr" x1="270" y1="296" x2="440" y2="353" marker-end="url(#arrow)"/>
<line class="arr" x1="525" y1="296" x2="500" y2="353" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="545" x2="490" y2="413" marker-end="url(#arrow)"/>
<text class="ts note" x="360" y="630" text-anchor="middle">μᵢₛ = λₛ(xᵢ) × conversion factor × litres filtered × water-column offset; all four are fixed inputs</text>
<text class="ts note" x="360" y="650" text-anchor="middle">qPCR standard curve and detection rate κ are fixed</text>
<text class="ts note" x="360" y="675" text-anchor="middle">Purple = estimated · coral = latent, one per bottle · teal = observed</text>
</svg>
